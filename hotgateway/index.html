<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout com Adyen SDK</title>
    <!-- Script da Adyen/Hotmart -->
    <script src="/adyen-prod-1-17.js"></script>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #0070ba; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Pagamento com Cartão de Crédito</h2>
    <form id="payment-form">
        <div class="form-group">
            <label for="card-number">Número do Cartão</label>
            <input type="text" id="card-number" placeholder="4111 1111 1111 1111" required>
        </div>
        
        <div class="form-group">
            <label for="card-holder">Nome no Cartão</label>
            <input type="text" id="card-holder" placeholder="Nome Completo" required>
        </div>

        <div class="form-group">
            <label for="expiry-month">Mês de Expiração (MM)</label>
            <input type="text" id="expiry-month" placeholder="12" maxlength="2" required>
        </div>

        <div class="form-group">
            <label for="expiry-year">Ano de Expiração (AAAA)</label>
            <input type="text" id="expiry-year" placeholder="2028" maxlength="4" required>
        </div>

        <div class="form-group">
            <label for="security-code">Código de Segurança (CVV)</label>
            <input type="text" id="security-code" placeholder="123" maxlength="4" required>
        </div>

        <!-- Campo oculto onde o SDK insere o token/encryptedData gerado -->
        <input type="hidden" id="adyen-encrypted-token" name="adyenToken">

        <button type="submit" id="submit-btn">Finalizar Pagamento</button>
    </form>

 <script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("payment-form");

        // 1. Chave pública da Adyen
        const adyenPublicKey = "10001|B4BB58B9CE7DF7B9B311D7B6256F65A045C09670B68807BBA836AFAC1AE7E52E66CE8A6ECC318A68C1640F35210581BF689FD2A9F86ABD519EEBFBDF40597913DF6EA0A4C1F09D4983F362C306BC40CAE06DA479537AE2380764792145CA4F6845D7F684128E8124DC6B143248C8574FDD69A9EA99495DD48224713E97E5297818DEDBC8AAFF0A4427C9A9CCF5298FF10392C8CAFB9DEF7F5AEC7A3061F932661B03D16B01ADB21781B120E0DD59C5D0652B4CB47A254FB095D94CECCEA1BC4F9EB051966CA20ED6D5262B866C3AF94B92641E014D315E4603C09F9FA7D3E148BB18F83AED2643B58958F451BFABBDDF8E1AFC8D9E964752650C37160B4D8A07";

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            // 2. Coletar os dados digitados
            const cardData = {
                number: document.getElementById("card-number").value.replace(/\s+/g, ''),
                holderName: document.getElementById("card-holder").value,
                generationtime: new Date().toISOString(),
                expiryMonth: document.getElementById("expiry-month").value,
                expiryYear: document.getElementById("expiry-year").value,
                cvc: document.getElementById("security-code").value
            };

            try {
                // 3. ATUALIZAÇÃO: Utilizar adyen.encrypt em vez de adyen.cse
                const cse = adyen.encrypt.createEncryption(adyenPublicKey, {});
                
                // Criptografa o objeto completo
                const tokenResult = cse.encrypt(cardData);

                // 4. Inserir o payload/token gerado no campo oculto do formulário
                document.getElementById("adyen-encrypted-token").value = tokenResult;

                console.log("Token/Dados Criptografados com Sucesso:", tokenResult);

                // 5. Enviar para a sua API/Backend
                // enviarParaBackend(tokenResult);

            } catch (error) {
                console.error("Erro ao gerar token da Adyen:", error);
            }
        });
    });
</script>
</body>
</html>
